[project]
name = "smsf-rules-mcp"
version = "0.1.0"
description = "MCP server: Australian SMSF contribution caps, thresholds and deadlines with primary-source citations"
readme = "README.md"
license = "MIT"
authors = [{ name = "Fatih Gurcaglar" }]
requires-python = ">=3.12"
keywords = ["mcp", "smsf", "superannuation", "australia"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Topic :: Office/Business :: Financial",
]
dependencies = ["mcp>=1.2"]

[project.scripts]
smsf-rules-mcp = "smsf_rules_mcp.server:main"

[project.urls]
Homepage = "https://github.com/Chaglar/smsf-rules-mcp"
Corpus = "https://smsfcore.com/rules"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smsf_rules_mcp"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
